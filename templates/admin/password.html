{% extends "admin/base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="admin-top"><div><h1>Change Password</h1><div style="color:#687286;font-size:13px">Keep your admin account secure.</div></div></div>
<div class="admin-card" style="max-width:650px">
<form method="post">
  <div class="form-group" style="margin-bottom:15px"><label>Current Password</label><input type="password" name="current_password" required></div>
  <div class="form-group" style="margin-bottom:15px"><label>New Password</label><input type="password" name="new_password" minlength="6" required></div>
  <div class="form-group" style="margin-bottom:15px"><label>Confirm New Password</label><input type="password" name="confirm_password" minlength="6" required></div>
  <button class="btn btn-primary" type="submit">Change Password</button>
</form>
</div>
{% endblock %}
