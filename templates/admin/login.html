<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | Sai Steel</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
<div class="login-box">
  <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Sai Steel">
  <h1>Admin Login</h1>
  <p>Manage products and website information.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <div class="form-group"><label>Username</label><input name="username" required autocomplete="username"></div>
    <div class="form-group"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary" type="submit">Login</button>
  </form>
  <p style="margin-top:20px;font-size:11px">Initial setup: admin / admin123. Change this password after login.</p>
</div>
</body>
</html>
